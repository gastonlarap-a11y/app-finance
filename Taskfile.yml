version: '3'

# Canonical Wails v3 root Taskfile. Drives `wails3 dev` / `wails3 build` via the
# per-OS task graphs under ./build. Regenerate the build/ assets with
# `wails3 task common:update:build-assets` after editing build/config.yml.

vars:
  APP_NAME: "app-finance"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  # Unused template platforms, gitignored (absent in CI checkouts) — optional.
  ios:
    taskfile: ./build/ios/Taskfile.yml
    optional: true
  android:
    taskfile: ./build/android/Taskfile.yml
    optional: true

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  package:dmg:
    summary: Packages a macOS .dmg (alias of darwin:package:dmg)
    cmds:
      - task: darwin:package:dmg

  # ---- quality gates (what CI runs; `task check` before declaring work done) ----

  lint:
    summary: Go (golangci-lint v2) + frontend (ESLint) lint
    cmds:
      - golangci-lint run ./...
      - npm --prefix frontend run lint

  test:
    summary: Go tests with the race detector + vitest (engine parity + lib)
    cmds:
      - go test -race ./...
      - npm --prefix frontend test

  typecheck:
    summary: Frontend typecheck, desktop (needs generated bindings) + web
    cmds:
      - npm --prefix frontend run typecheck

  vuln:
    summary: Known-vulnerability scan (Go reachability + npm production deps)
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - npm --prefix frontend audit --omit=dev --audit-level=high

  check:
    summary: Every quality gate — vet, lint, typecheck, tests, web build
    cmds:
      - go vet ./...
      - task: lint
      - task: typecheck
      - task: test
      - npm --prefix frontend run build:web

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:windows:
    summary: Cross-compiles a Windows .exe (amd64/x86_64) from macOS — for standard Windows PCs
    cmds:
      - task: windows:build
        vars:
          ARCH: amd64

  build:windows:arm64:
    summary: Cross-compiles a Windows .exe (arm64) from macOS — for ARM Windows devices
    cmds:
      - task: windows:build
        vars:
          ARCH: arm64

  build:windows:clean:
    summary: Removes the Windows .exe from bin/
    cmds:
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}.exe"

  package:windows:
    summary: Creates a Windows NSIS installer (amd64, per-user) — requires 'brew install makensis'
    cmds:
      - task: windows:package
        vars:
          ARCH: amd64
          # Per-user install (%LOCALAPPDATA%\Programs, no UAC): the in-app updater
          # (backend/updates) must be able to replace the exe without admin rights.
          INSTALL_SCOPE: user

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
