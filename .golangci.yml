version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint # errors.Is/As instead of == / type assertions
    - gocritic
    - modernize # Go 1.2x idioms (min/max, slices, range-over-int…)
    - nolintlint
    - revive
    - sqlclosecheck
    - unconvert
    - usestdlibvars
  settings:
    staticcheck:
      checks:
        - all
        # Defaults golangci-lint disables (doc/naming pedantry).
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # types.Decimal names its embedded field on purpose: it shadows Add/Sub.
        - -QF1008
    errcheck:
      exclude-functions:
        # Closing read-only handles / best-effort cleanup.
        - (*github.com/xuri/excelize/v2.File).Close
    revive:
      rules:
        # Keep the high-signal rules; skip doc-comment pedantry on bound methods.
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: unreachable-code
        - name: unused-parameter
          disabled: true
        - name: var-declaration
  exclusions:
    presets:
      - std-error-handling
    paths:
      # Generated by the Wails v3 template for unused platforms (gitignored).
      - build/
      - frontend/
      # Local OAuth secrets (gitignored, never in CI).
      - '.*\.local\.go$'

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/gastonlarap-a11y/app-finance
  exclusions:
    paths:
      - build/
      - frontend/
      - '.*\.local\.go$'
