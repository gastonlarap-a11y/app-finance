name: Release

# Pushing a tag vX.Y.Z builds the desktop installers and publishes them as a
# GitHub Release. The tag must match info.version in build/config.yml (bump it,
# run `wails3 task common:update:build-assets`, merge, then tag main).
# workflow_dispatch builds the same artifacts without publishing (dry run).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

# Read-only by default. Building (which runs npm install scripts, brew and the
# whole toolchain) holds no write token; only the small publish job below can
# create the release. The in-app updater installs what lands there, so this is
# the most sensitive workflow of the repo.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installers:
    # One macOS runner builds both: the universal .app/.dmg natively and the
    # Windows NSIS installer cross-compiled (pure-Go SQLite, no CGO for Windows).
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag must be checked against main's history
          persist-credentials: false

      - name: The tag points at a commit on main
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not on main: tag a merged commit"; exit 1
          fi

      - name: Read and check the version
        id: version
        run: |
          version=$(sed -n 's/^  version: "\([0-9][^"]*\)".*/\1/p' build/config.yml | head -1)
          if [ -z "$version" ]; then echo "::error::info.version not found in build/config.yml"; exit 1; fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match build/config.yml version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Bakes the Google OAuth "Desktop app" client into the binaries so installed
      # apps can back up to Drive (see backend/shared/drive/credentials.go). The
      # file is gitignored and only exists in this runner; a release without it
      # would silently lose Drive backups, so missing secrets fail the build.
      - name: Google OAuth client (Drive backup)
        env:
          CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::error::Set the GOOGLE_OAUTH_CLIENT_ID and GOOGLE_OAUTH_CLIENT_SECRET repository secrets"; exit 1
          fi
          # Google client ids/secrets are [A-Za-z0-9._-]; anything else would break the Go literal.
          for v in "$CLIENT_ID" "$CLIENT_SECRET"; do
            if ! printf '%s' "$v" | grep -Eq '^[A-Za-z0-9._-]+$'; then
              echo "::error::Unexpected characters in an OAuth secret"; exit 1
            fi
          done
          cat > backend/shared/drive/credentials.local.go <<EOF
          package drive

          // Generated by the release workflow from repository secrets. Do not commit.
          func init() {
          	bakedClientID = "${CLIENT_ID}"
          	bakedClientSecret = "${CLIENT_SECRET}"
          }
          EOF
          git check-ignore -q backend/shared/drive/credentials.local.go

      # No caches: they are shared with CI runs of pull requests, and a poisoned
      # one would end up inside the published installers.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc

      - name: Install toolchain (wails3 matching go.mod, makensis)
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          brew install makensis

      - name: Frontend dependencies
        run: npm ci
        working-directory: frontend

      # CI already gates main; this re-checks the exact tagged commit.
      - name: Backend checks (vet, race tests, vulnerabilities)
        run: |
          mkdir -p frontend/dist && touch frontend/dist/.gitkeep
          go vet ./...
          go test -race ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Engine tests (vitest)
        run: npm test
        working-directory: frontend

      - name: macOS — universal .app (arm64 + amd64) → .dmg + in-app update zip
        run: |
          wails3 task darwin:package:universal
          dmg="bin/App-Finance-${{ steps.version.outputs.version }}-macos.dmg"
          hdiutil create -volname "App Finance" -srcfolder bin/app-finance.app -ov -format UDZO "$dmg"
          # In-app updater artifact (backend/updates): the signed .app as the zip's
          # single top-level entry. No resource forks / xattrs / ACLs: ditto would
          # otherwise add ._* AppleDouble files inside the bundle, which break its
          # code-signature seal once the updater extracts them.
          ditto -c -k --norsrc --noextattr --noacl --keepParent bin/app-finance.app bin/app-finance-darwin-universal.zip
          if unzip -Z1 bin/app-finance-darwin-universal.zip | grep -Eq '(^|/)(\._|__MACOSX)'; then
            echo "::error::AppleDouble files in the update zip"; exit 1
          fi

      - name: Windows — NSIS installer (amd64, per-user) + in-app update exe
        run: |
          # Per-user install (%LOCALAPPDATA%\Programs, no UAC) so the in-app updater
          # can replace the exe without admin rights.
          wails3 task package:windows
          mv bin/app-finance-amd64-installer.exe "bin/App-Finance-${{ steps.version.outputs.version }}-windows-setup.exe"
          cp bin/app-finance.exe bin/app-finance-windows-amd64.exe

      - name: Checksums
        working-directory: bin
        # The in-app updater refuses any artifact that is not listed here.
        run: |
          shasum -a 256 App-Finance-*.dmg App-Finance-*-setup.exe \
            app-finance-darwin-universal.zip app-finance-windows-amd64.exe | tee SHA256SUMS.txt

      # Always uploaded: the dry run keeps them as its result, and a tag hands
      # them to the publish job (the only one allowed to write).
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers
          if-no-files-found: error
          path: |
            bin/App-Finance-*.dmg
            bin/App-Finance-*-setup.exe
            bin/app-finance-darwin-universal.zip
            bin/app-finance-windows-amd64.exe
            bin/SHA256SUMS.txt
    outputs:
      version: ${{ steps.version.outputs.version }}

  # Signs the in-app update artifacts (backend/updates refuses unsigned ones).
  # Its own job so the signing key never shares a runner with the build, which
  # ran npm install scripts and the whole toolchain: here only the Go standard
  # library runs (tools/updatesign). The key lives in the `release`
  # environment, whose deployment policy admits only v* tags.
  sign:
    needs: installers
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installers
          path: bin
      # Fails when the secret does not pair with the committed public key: a
      # release the installed apps could not verify is never published.
      - name: Sign the update artifacts
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          go run ./tools/updatesign sign -pub backend/updates/update_signing.pub \
            bin/app-finance-darwin-universal.zip bin/app-finance-windows-amd64.exe
          go run ./tools/updatesign verify -pub backend/updates/update_signing.pub \
            bin/app-finance-darwin-universal.zip bin/app-finance-windows-amd64.exe
      - name: Upload signatures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signatures
          if-no-files-found: error
          path: |
            bin/app-finance-darwin-universal.zip.sig
            bin/app-finance-windows-amd64.exe.sig

  publish:
    needs: [installers, sign]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installers
          path: bin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signatures
          path: bin
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.installers.outputs.version }}
        run: |
          cat > notes.md <<'EOF'
          ## Actualizar desde la app

          Desde la versión 0.3.0 la app avisa sola cuando hay una versión nueva: pulsa **Actualizar** y
          luego **Reiniciar y actualizar** (respalda antes si tienes activado el respaldo al cerrar).
          Los archivos `app-finance-darwin-universal.zip` y `app-finance-windows-amd64.exe` son los que
          usa ese actualizador; para instalar a mano usa el `.dmg` o el `-setup.exe`. Van firmados
          (`.sig`, Ed25519) y la app rechaza cualquier actualización cuya firma no verifique.

          ## Instalación manual

          **macOS** (Apple Silicon e Intel): cierra la app, abre el `.dmg` y arrastra **app-finance** a
          *Aplicaciones* (reemplaza la versión anterior).

          La app no está notarizada por Apple, así que la primera vez macOS avisa que «no pudo
          verificar» la app. **No elijas «Trasladar a la Papelera»**: pulsa **OK**, ve a **Ajustes del
          Sistema → Privacidad y seguridad**, baja hasta el mensaje sobre «app-finance» y pulsa
          **Abrir igualmente** (pide tu contraseña). Desde macOS 15 el clic derecho → Abrir ya no
          sirve para esto. Alternativa en Terminal, que quita la cuarentena solo a esta app:

          ```
          xattr -dr com.apple.quarantine /Applications/app-finance.app
          ```

          Si ya la mandaste a la Papelera: ábrela, clic derecho sobre **app-finance** → **Devolver**,
          y sigue los pasos anteriores.

          **Windows**: ejecuta `…-windows-setup.exe`. SmartScreen avisará porque no tiene firma
          comercial: **Más información → Ejecutar de todos modos**. Se instala para tu usuario (sin
          permisos de administrador) en `%LOCALAPPDATA%\Programs`. Si tenías una versión anterior a la
          0.3.0 (instalada en *Archivos de programa*), desinstálala primero desde Configuración →
          Aplicaciones; tus datos no se borran.

          Tus datos no se tocan: la base de datos vive fuera de la app y las migraciones nuevas se
          aplican solas al abrirla. Recomendado: «☁ Respaldar» antes de actualizar.

          **iPad**: la versión web (PWA) avisa cuando hay una versión nueva: toca **Actualizar** en
          el aviso de arriba.

          Verifica la descarga con `SHA256SUMS.txt` (`shasum -a 256 -c SHA256SUMS.txt`).
          EOF
          # No checkout in this job: name the repository explicitly.
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "App Finance ${VERSION}" \
            --notes-file notes.md \
            --generate-notes \
            bin/App-Finance-*.dmg bin/App-Finance-*-setup.exe \
            bin/app-finance-darwin-universal.zip bin/app-finance-windows-amd64.exe \
            bin/app-finance-darwin-universal.zip.sig bin/app-finance-windows-amd64.exe.sig \
            bin/SHA256SUMS.txt
