name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow only needs to read the repo.
permissions:
  contents: read

# Never waste minutes on stale commits: one run per ref, cancel the previous.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secret scanning on every push/PR (deny rules on .env* are only advisory).
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks needs full history to resolve the pushed range
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # required by the action to scan PRs

  # Go backend + the desktop frontend (which needs wails3-generated bindings).
  # macOS, not ubuntu: Wails v3 on Linux needs GTK4/WebKitGTK system libs and
  # this app only ships for macOS/Windows. macOS runners are free on public repos.
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # main.go embeds all:frontend/dist; the dir must exist for any go command.
      - name: Placeholder frontend/dist for go:embed
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
      - name: Vet
        run: go vet ./...
      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
      - name: Test (race detector)
        run: go test -race ./...
      - name: Vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      # No native window on CI: compile-check the backend, don't run wails3 build.
      - name: Build (compile check)
        run: go build ./...

      # Desktop frontend: typecheck against the real bindings. services/finance.ts
      # assigns the generated bindings to the hand-written contract, so a Go
      # signature change not mirrored in contract.ts fails here.
      - name: Install wails3 CLI (matches the go.mod pin)
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
      - name: Generate TS bindings
        run: wails3 generate bindings -ts
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci
        working-directory: frontend
      - name: Lint (ESLint, type-aware)
        run: npm run lint
        working-directory: frontend
      - name: Typecheck (desktop + web)
        run: npm run typecheck
        working-directory: frontend

  # Bindings-independent web target: engine tests (Go⇄TS parity mirror) + PWA bundle.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Engine + lib tests (vitest)
        run: npm test
      - name: Typecheck + build (web target)
        run: npm run build:web
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
